<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis - Asistente Virtual</title>

<!-- Favicon / Ícono de la pestaña -->
<link rel="icon" href="mascota.png.jfif">

<!-- Fuente Google Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: #EAEFF5;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #app {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    background: #FFFFFF;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
  }

  @media (min-width: 450px) {
    #app {
      height: 90vh;
      border-radius: 20px;
      overflow: hidden;
    }
  }

  /* Encabezado */
  #header {
    background: #003A8F;
    color: #FFFFFF;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar-header {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    background: #FFFFFF;
  }

  .header-info {
    display: flex;
    flex-direction: column;
  }

  .header-info .title {
    font-size: 16px;
    font-weight: 600;
  }

  .header-info .status {
    font-size: 12px;
    opacity: 0.85;
  }

  /* Área del Chat */
  #chat {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    background: #F8FAFC;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 80%;
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
    animation: fadeIn 0.2s ease-in-out;
  }

  .bot {
    background: #E2E8F0;
    color: #1E293B;
    align-self: flex-start;
    border-bottom-left-radius: 2px;
  }

  .user {
    background: #003A8F;
    color: #FFFFFF;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
  }

  .time {
    font-size: 10px;
    opacity: 0.7;
    text-align: right;
    margin-top: 4px;
  }

  /* Área de entrada de texto */
  #inputArea {
    padding: 12px;
    background: #FFFFFF;
    border-top: 1px solid #E2E8F0;
    display: flex;
    gap: 8px;
  }

  #input {
    flex: 1;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid #CBD5E1;
    border-radius: 24px;
    outline: none;
    transition: border-color 0.2s;
  }

  #input:focus {
    border-color: #003A8F;
  }

  .send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #003A8F;
    color: #FFFFFF;
    border: none;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .send-btn:hover {
    background: #002B6B;
  }

  /* Pie de página de créditos */
  .footer-creditos {
    text-align: center;
    font-size: 11px;
    color: #64748B;
    padding: 8px;
    background: #F1F5F9;
    border-top: 1px solid #E2E8F0;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body>

<div id="app">
  <div id="header">
    <img class="avatar-header" src="mascota.png.jfif" alt="Jarvis Avatar" onerror="this.src='https://via.placeholder.com/40'">
    <div class="header-info">
      <span class="title">Jarvis</span>
      <span class="status">● En línea</span>
    </div>
  </div>

  <div id="chat"></div>

  <div id="inputArea">
    <input id="input" type="text" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
    <button class="send-btn" id="btnEnviar">➤</button>
  </div>

  <div class="footer-creditos">
    Desarrollado por: Lázaro Purizaca
  </div>
</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const btnEnviar = document.getElementById("btnEnviar");

  // Obtener hora actual en formato HH:MM
  function obtenerHora() {
    const ahora = new Date();
    const horas = ahora.getHours().toString().padStart(2, '0');
    const minutos = ahora.getMinutes().toString().padStart(2, '0');
    return `${horas}:${minutos}`;
  }

  // Insertar mensaje del bot
  function botMensaje(texto) {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.innerHTML = `${texto}<div class="time">${obtenerHora()}</div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  // Insertar mensaje del usuario
  function usuarioMensaje(texto) {
    const div = document.createElement("div");
    div.className = "msg user";
    div.innerHTML = `${texto}<div class="time">${obtenerHora()}</div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  // Lógica de procesamiento de las respuestas del nuevo Jarvis
  function procesarRespuesta(mensaje) {
    const texto = mensaje.toLowerCase().trim();

    // AQUÍ PUEDES AGREGAR O MODIFICAR LA LÓGICA DE TU NUEVO PROYECTO
    if (texto.includes("hola") || texto.includes("buenas")) {
      botMensaje("¡Hola! Soy Jarvis. ¿En qué te puedo ayudar con tu nuevo proyecto?");
    } else if (texto.includes("quien eres") || texto.includes("quién eres")) {
      botMensaje("Soy Jarvis, un asistente virtual creado para responder tus consultas rápidamente.");
    } else if (texto.includes("creador") || texto.includes("desarrollador")) {
      botMensaje("Fui creado por Lázaro Purizaca.");
    } else {
      botMensaje("Entendido. Aún me estoy configurando para responder a este nuevo tipo de consultas.");
    }
  }

  // Función para enviar mensaje
  function enviar() {
    const texto = input.value.trim();
    if (texto === "") return;

    usuarioMensaje(texto);
    input.value = "";

    // Simular un pequeño tiempo de respuesta de Jarvis
    setTimeout(() => {
      procesarRespuesta(texto);
    }, 500);
  }

  // Event Listeners
  btnEnviar.addEventListener("click", enviar);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      enviar();
    }
  });

  // Mensaje de bienvenida al cargar
  window.onload = () => {
    botMensaje("¡Hola! Bienvenido al nuevo sistema de Jarvis 👋🏼. ¿En qué trabajaremos hoy?");
  };
</script>

</body>
</html>
