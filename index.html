<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS System - Desktop Interface</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #003A8F;
      --primary-glow: #00f3ff;
      --bg-dark: rgba(10, 15, 26, 0.92);
      --border-color: rgba(0, 243, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #050811;
      background-image: radial-gradient(circle at center, #0c1b33 0%, #050811 100%);
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 30px;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--primary-glow);
      text-shadow: 0 0 8px var(--primary-glow);
    }

    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .clock {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary-glow);
      text-shadow: 0 0 10px var(--primary-glow);
    }

    .date {
      font-size: 0.75rem;
      color: #8a9ba8;
      letter-spacing: 1px;
    }

    /* Desktop Chat Container */
    #app-container {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 80px auto 70px auto;
      display: flex;
      flex-direction: column;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .bot {
      background: rgba(226, 232, 240, 0.95);
      color: #0f172a;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .user {
      background: var(--primary);
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
      box-shadow: 0 0 10px rgba(0, 58, 143, 0.5);
    }

    .time {
      font-size: 10px;
      opacity: 0.75;
      text-align: right;
      margin-top: 4px;
    }

    /* Input Area */
    #inputArea {
      padding: 14px 20px;
      background: rgba(10, 15, 26, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      padding: 12px 18px;
      font-size: 14px;
      border-radius: 24px;
      border: 1px solid var(--border-color);
      background: rgba(5, 8, 17, 0.8);
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    #input:focus {
      border-color: var(--primary-glow);
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      border: 1px solid var(--primary-glow);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
    }

    .send-btn:hover {
      background: #002b6b;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
    }

    /* Sliding Taskbar Menu */
    .taskbar-wrapper {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1000;
    }

    .menu-drawer {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      width: 360px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
    }

    .menu-drawer.open {
      max-height: 220px;
      padding: 12px 0;
    }

    .menu-options {
      list-style: none;
    }

    .menu-options li a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      color: #e0f7fc;
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .menu-options li a:hover {
      background: rgba(0, 243, 255, 0.15);
      color: var(--primary-glow);
      padding-left: 30px;
    }

    .taskbar-trigger {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: 15px 15px 0 0;
      padding: 8px 36px;
      cursor: pointer;
      color: var(--primary-glow);
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 2px;
      box-shadow: 0 -2px 15px rgba(0, 243, 255, 0.3);
    }

    .footer-creditos {
      text-align: center;
      font-size: 10px;
      color: #818cf8;
      padding: 6px;
      background: rgba(10, 15, 26, 0.95);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="brand">
      <span>&#x2B21;</span> JARVIS DESKTOP
    </div>
    <div class="clock-container">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date">CARGANDO...</div>
    </div>
  </header>

  <!-- App Interface -->
  <div id="app-container">
    <div id="chat"></div>
    <div id="inputArea">
      <input id="input" type="text" placeholder="Escribe tu comando o mensaje..." autocomplete="off">
      <button class="send-btn" id="btnEnviar">➤</button>
    </div>
    <div class="footer-creditos">Desarrollado por: Lázaro Purizaca</div>
  </div>

  <!-- Taskbar Menu -->
  <div class="taskbar-wrapper">
    <div id="menuDrawer" class="menu-drawer">
      <ul class="menu-options">
        <li><a onclick="ejecutarMenu('Diagnóstico del Sistema')"><span>⚙️</span> Diagnóstico del Sistema</a></li>
        <li><a onclick="ejecutarMenu('Protocolos de Red')"><span>🌐</span> Protocolos de Red</a></li>
        <li><a onclick="ejecutarMenu('Gestión de Archivos')"><span>📂</span> Gestión de Archivos</a></li>
      </ul>
    </div>
    <button id="taskbarTrigger" class="taskbar-trigger">MENÚ ▲</button>
  </div>

  <script>
    var chat = document.getElementById("chat");
    var input = document.getElementById("input");
    var btnEnviar = document.getElementById("btnEnviar");

    // Reloj Digital
    function updateClock() {
      var now = new Date();
      var hours = String(now.getHours()).padStart(2, '0');
      var minutes = String(now.getMinutes()).padStart(2, '0');
      var seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = hours + ":" + minutes + ":" + seconds;

      var options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('es-ES', options).toUpperCase();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Menú Desplegable
    var trigger = document.getElementById('taskbarTrigger');
    var drawer = document.getElementById('menuDrawer');

    trigger.addEventListener('click', function(e) {
      e.stopPropagation();
      drawer.classList.toggle('open');
    });

    document.addEventListener('click', function(e) {
      if (!drawer.contains(e.target) && !trigger.contains(e.target)) {
        drawer.classList.remove('open');
      }
    });

    function hora() {
      var d = new Date();
      return d.getHours() + ":" + String(d.getMinutes()).padStart(2, '0');
    }

    function bot(msg) {
      var div = document.createElement("div");
      div.className = "msg bot";
      div.innerHTML = msg + '<div class="time">' + hora() + '</div>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function user(msg) {
      var div = document.createElement("div");
      div.className = "msg user";
      div.innerHTML = msg + '<div class="time">' + hora() + '</div>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function ejecutarMenu(opcion) {
      drawer.classList.remove('open');
      bot("Ejecutando: <b>" + opcion + "</b>");
    }

    function enviar() {
      var texto = input.value.trim();
      if (texto === "") return;
      input.value = "";
      user(texto);

      if (texto.toLowerCase().indexOf("hola") !== -1) {
        bot("¡Hola! Sistema de escritorio JARVIS en línea. ¿Qué orden deseas ejecutar?");
      } else {
        bot("Comando recibido: " + texto);
      }
    }

    btnEnviar.addEventListener("click", enviar);
    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        enviar();
      }
    });

    window.onload = function() {
      bot("<b>JARVIS Desktop Interface v2.0 👋</b><br>Sistema listo. Puedes usar el menú inferior o ingresar comandos directamente.");
    };
  </script>
</body>
</html>
