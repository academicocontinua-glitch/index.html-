<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - UDEP Interface</title>

  <!-- Favicon / Ícono de la pestaña -->
  <link rel="icon" href="mascota.png.jfif">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #003A8F;
      --primary-glow: #00f3ff;
      --bg-dark: rgba(10, 15, 26, 0.9);
      --border-color: rgba(0, 243, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
    }

    body {
      background-color: #050811;
      background-image: radial-gradient(circle at center, #0c1b33 0%, #050811 100%);
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--primary-glow);
      text-shadow: 0 0 8px var(--primary-glow);
    }

    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .clock {
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--primary-glow);
      text-shadow: 0 0 10px var(--primary-glow);
    }

    .date {
      font-size: 0.7rem;
      color: #8a9ba8;
      letter-spacing: 1px;
    }

    /* Contenedor del Chat Principal */
    #app-container {
      flex: 1;
      max-width: 480px;
      width: 100%;
      margin: 70px auto 70px auto;
      display: flex;
      flex-direction: column;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    #chat {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 80%;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.4;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease-in-out;
    }

    .bot {
      background: rgba(226, 232, 240, 0.95);
      color: #0f172a;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .user {
      background: var(--primary);
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
      box-shadow: 0 0 10px rgba(0, 58, 143, 0.5);
    }

    .time {
      font-size: 9.5px;
      opacity: 0.75;
      text-align: right;
      margin-top: 4px;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      font-size: 13.5px;
      margin: 4px 0;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      border: 1px solid var(--primary-glow);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: #002b6b;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
    }

    .ctx-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 6px 0;
    }

    .ctx-btn {
      background: rgba(255, 255, 255, 0.1);
      color: var(--primary-glow);
      border: 1px solid var(--primary-glow);
      padding: 8px 12px;
      border-radius: 18px;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .ctx-btn:hover {
      background: var(--primary-glow);
      color: #050811;
      font-weight: 600;
    }

    /* Input Area */
    #inputArea {
      padding: 12px;
      background: rgba(10, 15, 26, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    #input {
      flex: 1;
      padding: 10px 16px;
      font-size: 13.5px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: rgba(5, 8, 17, 0.8);
      color: #fff;
      outline: none;
    }

    #input:focus {
      border-color: var(--primary-glow);
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: 1px solid var(--primary-glow);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Bottom Taskbar Drawer */
    .taskbar-wrapper {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1000;
    }

    .menu-drawer {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      width: 320px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease;
      box-shadow: 0 -5px 25px rgba(0, 243, 255, 0.2);
      backdrop-filter: blur(10px);
    }

    .menu-drawer.open {
      max-height: 280px;
      padding: 15px 0;
    }

    .menu-options {
      list-style: none;
    }

    .menu-options li a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 25px;
      color: #e0f7fc;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .menu-options li a:hover {
      background: rgba(0, 243, 255, 0.15);
      color: var(--primary-glow);
      padding-left: 30px;
    }

    .taskbar-trigger {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: 15px 15px 0 0;
      padding: 8px 30px;
      cursor: pointer;
      color: var(--primary-glow);
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: 0 -2px 15px rgba(0, 243, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .icon-arrow {
      transition: transform 0.3s ease;
    }

    .menu-drawer.open + .taskbar-trigger .icon-arrow {
      transform: rotate(180deg);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="brand">
      <img src="mascota.png.jfif" alt="Logo" onerror="this.src='https://via.placeholder.com/32'">
      JARVIS UDEP
    </div>
    <div class="clock-container">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date">CARGANDO...</div>
    </div>
  </header>

  <!-- App Interface -->
  <div id="app-container">
    <div id="chat"></div>

    <div id="inputArea">
      <input id="input" type="text" placeholder="Escribe 'Hola' o tu consulta..." autocomplete="off">
      <button class="send-btn" id="btnEnviar">➤</button>
    </div>
  </div>

  <!-- Sliding Taskbar Menu -->
  <div class="taskbar-wrapper">
    <div id="menuDrawer" class="menu-drawer">
      <ul class="menu-options">
        <li><a onclick="ejecutarMenu('1')"><span>🕒</span> Horarios de Ventanilla</a></li>
        <li><a onclick="ejecutarMenu('2')"><span>🏢</span> Horarios de Secretaría</a></li>
        <li><a onclick="ejecutarMenu('3')"><span>📚</span> Reservar Sala de Estudio</a></li>
        <li><a onclick="ejecutarMenu('4')"><span>📅</span> Calendario y Exámenes</a></li>
        <li><a onclick="ejecutarMenu('tramites')"><span>🧭</span> Sección de Trámites</a></li>
        <li><a onclick="ejecutarMenu('guias')"><span>📂</span> Documentos & Guías PDF</a></li>
      </ul>
    </div>
    <button id="taskbarTrigger" class="taskbar-trigger">
      MENÚ <span class="icon-arrow">&#x25B2;</span>
    </button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const btnEnviar = document.getElementById("btnEnviar");
    let contextoGlobal = "";

    // Digital Clock
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('es-ES', options).toUpperCase();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Drawer Logic
    const trigger = document.getElementById('taskbarTrigger');
    const drawer = document.getElementById('menuDrawer');

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      drawer.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!drawer.contains(e.target) && !trigger.contains(e.target)) {
        drawer.classList.remove('open');
      }
    });

    function hora() {
      const d = new Date();
      return d.getHours() + ":" + d.getMinutes().toString().padStart(2, '0');
    }

    function bot(msg) {
      const div = document.createElement("div");
      div.className = "msg bot";
      div.innerHTML = msg + `<div class="time">${hora()}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function user(msg) {
      const div = document.createElement("div");
      div.className = "msg user";
      div.innerHTML = msg + `<div class="time">${hora()}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function botonesContextuales(lista) {
      limpiarContextuales();
      const contenedor = document.createElement("div");
      contenedor.className = "ctx-container";
      lista.forEach(item => {
        const b = document.createElement("button");
        b.className = "ctx-btn";
        b.innerHTML = item.texto;
        b.onclick = () => {
          input.value = item.valor;
          enviar();
        };
        contenedor.appendChild(b);
      });
      chat.appendChild(contenedor);
      chat.scrollTop = chat.scrollHeight;
    }

    function limpiarContextuales() {
      document.querySelectorAll(".ctx-container").forEach(c => c.remove());
    }

    function ejecutarMenu(opcion) {
      drawer.classList.remove('open');
      responder(opcion);
    }

    function responder(t) {
      limpiarContextuales();
      if(t==="1"){
        bot("🕒 Horario de atención en ventanilla: 9:00 am - 12:30 pm y 4:00 pm - 6:00 pm");
      }
      else if(t==="2"){
        bot("🕒 Horario de atención en secretaría: 10:00 am - 12:30 pm y 4:10 pm - 5:30 pm<br>📞 Anexo: 3113");
      }
      else if(t==="3"){
        bot(`📚 <b>Reserva de sala:</b><br><br>
Enviar correo a: <b style="color:#00f3ff;">safcceeee-piura@udep.edu.pe</b><br>
✓ Mínimo 3 y máximo 6 integrantes.<br>
✓ Mínimo 2 días hábiles de anticipación.`);
      }
      else if(t==="4"){
        bot("📄 <b>Exámenes y Calendario:</b>");
        const b1 = document.createElement("button");
        b1.className = "btn-action";
        b1.innerHTML = "🔗 Exámenes disponibles para recoger";
        b1.onclick = () => window.open("https://udepoffice365ms-my.sharepoint.com/:x:/g/personal/rosamaria_masias_udep_edu_pe/EWihxMsRb25Iuvkhp9RDLj0Bo7taaxBWoC3Zp5dMNehltQ?rtime=SpHsHsNV3Ug", "_blank");
        chat.appendChild(b1);

        const b2 = document.createElement("button");
        b2.className = "btn-action";
        b2.innerHTML = "📅 Calendario Académico PDF";
        b2.onclick = () => window.open("https://udepoffice365ms-my.sharepoint.com/:b:/g/personal/lazaro_purizaca_g_udep_edu_pe/IQAdJf7wjXsIRIHlr_2phXDQAW8NxF2VNk6DrKX2avNOo-8?e=RW95nO", "_blank");
        chat.appendChild(b2);
      }
      else if(t==="tramites"){
        bot("🧭 <b>Trámites disponibles:</b>");
        botonesContextuales([
          { texto: "🔄 Cambio de Carrera", valor: "cambio de carrera" },
          { texto: "🚫 Retiro de Curso / Carrera", valor: "retiro de curso" },
          { texto: "🎓 Bachiller / Egresados", valor: "egresado" }
        ]);
      }
      else if(t==="guias"){
        bot("📂 <b>Documentos Oficiales PDF:</b>");
        const b1 = document.createElement("button");
        b1.className = "btn-action";
        b1.innerHTML = "📖 Reglamento General (RFAG)";
        b1.onclick = () => window.open("https://udepoffice365ms-my.sharepoint.com/:b:/g/personal/lazaro_purizaca_g_udep_edu_pe/IQD2Bdh1K4taQLBEopwA3SHpAXL9Vbua01jwbjK-R8dcClA?e=b5joDQ", "_blank");
        chat.appendChild(b1);

        const b2 = document.createElement("button");
        b2.className = "btn-action";
        b2.innerHTML = "📝 Hoja de Reclamos PDF";
        b2.onclick = () => window.open("https://udepoffice365ms-my.sharepoint.com/:b:/g/personal/lazaro_purizaca_g_udep_edu_pe/IQApyzFylfSHT4PI6uVe40POATy9_WrsoGT8qSS2KcGM3Xk?e=47Zyzt", "_blank");
        chat.appendChild(b2);

        const b3 = document.createElement("button");
        b3.className = "btn-action";
        b3.innerHTML = "📑 Reprogramación de Exámenes PDF";
        b3.onclick = () => window.open("https://udepoffice365ms-my.sharepoint.com/:b:/g/personal/lazaro_purizaca_g_udep_edu_pe/IQDVIEWE_E86QYQnR95mGdklAelvUof1yBpGsEASJy3Jpsg?e=1pB4TL", "_blank");
        chat.appendChild(b3);
      }
      else if(t==="pdf_clc"){
        bot("📢 <b>Comunicado Oficial CLC:</b><br>Para convalidar o registrar tu CLC, tienes que estar atento a los avisos de SIGA y CANVAS, ahí se establecen fechas fijas donde puedes presentar :)");
      }
      else if(t==="cambio_carrera"){
        bot("📣 <b>Comunicado Cambio de Carrera:</b><br>Para solicitar un cambio de carrera, es necesario mandar un correo a secretaría académica para obtener todo de manera detallada y precisa.");
      }
      else if(t==="retiro_curso"){
        bot("📣 <b>Comunicado Retiro de Curso / Carrera:</b><br>Los retiros se hacen a través del SIGA, en la parte de trámites, para tener más información puedes mandar un correo a secretaría académica :)");
      }
      else if(t==="egresado"){
        bot("🎓 <b>Oficina de Atención al Egresado:</b><br>Contacto: Melissa Coello<br>📧 melissa.coello@udep.edu.pe<br>📞 Anexo: 3109");
      }
    }

    function enviar() {
      const texto = input.value.trim().toLowerCase();
      if(texto === "") return;
      input.value = "";
      user(texto);
      limpiarContextuales();

      const verificar = (lista) => lista.some(p => texto.includes(p));

      if(verificar(["cambio de carrera", "cambiar de carrera"])) {
        responder("cambio_carrera");
      }
      else if(verificar(["retiro de curso", "retirar curso", "retiro de carrera"])) {
        responder("retiro_curso");
      }
      else if(verificar(["clc", "convalidar ingles", "convalidar inglés"])) {
        responder("pdf_clc");
      }
      else if(verificar(["reglamento", "rfag"])) {
        responder("guias");
      }
      else if(verificar(["horario", "secretaria", "ventanilla"])) {
        responder("2");
      }
      else if(verificar(["creador", "lazaro", "lázaro", "purizaca"])) {
        bot("Mi creador es Lázaro Purizaca, estudió en UDEP como tú.");
      }
      else if(verificar(["hola", "buenas", "jarvis"])) {
        bot("¡Hola! Soy Jarvis 👋🏼🏼. ¿En qué puedo asesorarte hoy sobre la facultad?");
      }
      else {
        bot("Disculpa, mi creador aún me está educando para poder comprender todo.");
      }
    }

    btnEnviar.addEventListener("click", enviar);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        enviar();
      }
    });

    window.onload = () => {
      bot("<b>Hola, soy Jarvis 👋</b><br>Asistente Virtual de CC.EE.EE - UDEP.<br>Abre el menú desplegable inferior o escríbeme directamente.");
    };
  </script>
</body>
</html>
