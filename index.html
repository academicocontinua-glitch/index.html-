<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS System</title>

  <!-- Favicon / Ícono de la pestaña -->
  <link rel="icon" href="mascota.png.jfif">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #003A8F;
      --primary-glow: #00f3ff;
      --bg-dark: rgba(10, 15, 26, 0.92);
      --border-color: rgba(0, 243, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #050811;
      background-image: radial-gradient(circle at center, #0c1b33 0%, #050811 100%);
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-glow);
    }

    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .clock {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary-glow);
    }

    .date {
      font-size: 0.7rem;
      color: #8a9ba8;
    }

    /* Chat Container */
    #app-container {
      flex: 1;
      max-width: 440px;
      width: 100%;
      margin: 70px auto 70px auto;
      display: flex;
      flex-direction: column;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
    }

    #chat {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .bot {
      background: rgba(226, 232, 240, 0.95);
      color: #0f172a;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .user {
      background: var(--primary);
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .time {
      font-size: 9.5px;
      opacity: 0.75;
      text-align: right;
      margin-top: 4px;
    }

    /* Input Area */
    #inputArea {
      padding: 12px;
      background: rgba(10, 15, 26, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    #input {
      flex: 1;
      padding: 10px 16px;
      font-size: 13.5px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: rgba(5, 8, 17, 0.8);
      color: #fff;
      outline: none;
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: 1px solid var(--primary-glow);
      cursor: pointer;
    }

    /* Taskbar Menu */
    .taskbar-wrapper {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1000;
    }

    .menu-drawer {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      width: 320px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .menu-drawer.open {
      max-height: 200px;
      padding: 10px 0;
    }

    .menu-options {
      list-style: none;
    }

    .menu-options li a {
      display: block;
      padding: 10px 20px;
      color: #e0f7fc;
      text-decoration: none;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .menu-options li a:hover {
      background: rgba(0, 243, 255, 0.15);
      color: var(--primary-glow);
    }

    .taskbar-trigger {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: 15px 15px 0 0;
      padding: 8px 30px;
      cursor: pointer;
      color: var(--primary-glow);
      font-weight: bold;
      font-size: 12px;
    }

    .footer-creditos {
      text-align: center;
      font-size: 10px;
      color: #818cf8;
      padding: 4px;
      background: rgba(10, 15, 26, 0.95);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="brand">
      <img src="mascota.png.jfif" alt="Logo" onerror="this.src='https://via.placeholder.com/32'">
      JARVIS SYSTEM
    </div>
    <div class="clock-container">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date">CARGANDO...</div>
    </div>
  </header>

  <!-- App Interface -->
  <div id="app-container">
    <div id="chat"></div>

    <div id="inputArea">
      <input id="input" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
      <button class="send-btn" id="btnEnviar">➤</button>
    </div>
    <div class="footer-creditos">Desarrollado por: Lázaro Purizaca</div>
  </div>

  <!-- Taskbar Menu -->
  <div class="taskbar-wrapper">
    <div id="menuDrawer" class="menu-drawer">
      <ul class="menu-options">
        <li><a onclick="ejecutarMenu('Opción 1')">📌 Opción 1</a></li>
        <li><a onclick="ejecutarMenu('Opción 2')">⚙️ Opción 2</a></li>
        <li><a onclick="ejecutarMenu('Opción 3')">📂 Opción 3</a></li>
      </ul>
    </div>
    <button id="taskbarTrigger" class="taskbar-trigger">MENÚ ▲</button>
  </div>

  <script>
    var chat = document.getElementById("chat");
    var input = document.getElementById("input");
    var btnEnviar = document.getElementById("btnEnviar");

    function updateClock() {
      var now = new Date();
      var hours = String(now.getHours()).padStart(2, '0');
      var minutes = String(now.getMinutes()).padStart(2, '0');
      var seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = hours + ":" + minutes + ":" + seconds;

      var options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('es-ES', options).toUpperCase();
    }
    setInterval(updateClock, 1000);
    updateClock();

    var trigger = document.getElementById('taskbarTrigger');
    var drawer = document.getElementById('menuDrawer');

    trigger.addEventListener('click', function(e) {
      e.stopPropagation();
      drawer.classList.toggle('open');
    });

    document.addEventListener('click', function(e) {
      if (!drawer.contains(e.target) && !trigger.contains(e.target)) {
        drawer.classList.remove('open');
      }
    });

    function hora() {
      var d = new Date();
      return d.getHours() + ":" + String(d.getMinutes()).padStart(2, '0');
    }

    function bot(msg) {
      var div = document.createElement("div");
      div.className = "msg bot";
      div.innerHTML = msg + '<div class="time">' + hora() + '</div>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function user(msg) {
      var div = document.createElement("div");
      div.className = "msg user";
      div.innerHTML = msg + '<div class="time">' + hora() + '</div>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function ejecutarMenu(opcion) {
      drawer.classList.remove('open');
      bot("Seleccionaste: " + opcion);
    }

    function enviar() {
      var texto = input.value.trim();
      if (texto === "") return;
      input.value = "";
      user(texto);

      if (texto.toLowerCase().indexOf("hola") !== -1) {
        bot("¡Hola! Sistema activo. ¿En qué te ayudo hoy?");
      } else {
        bot("Mensaje recibido: " + texto);
      }
    }

    btnEnviar.addEventListener("click", enviar);
    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        enviar();
      }
    });

    window.onload = function() {
      bot("<b>Jarvis System Online 👋</b><br>Haz clic en el menú inferior o escribe tu mensaje.");
    };
  </script>
</body>
</html>
