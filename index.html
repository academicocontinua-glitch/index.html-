<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Interface</title>
  <style>
    :root {
      --primary: #00f3ff;
      --bg-dark: rgba(10, 15, 26, 0.85);
      --border-color: rgba(0, 243, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #050811;
      background-image: radial-gradient(circle at center, #0c1b33 0%, #050811 100%);
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    /* System Status / Brand */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--primary);
      text-shadow: 0 0 8px var(--primary);
    }

    /* Digital Clock */
    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .clock {
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary);
    }

    .date {
      font-size: 0.75rem;
      color: #8a9ba8;
      letter-spacing: 1px;
    }

    /* Bottom Taskbar & Sliding Menu */
    .taskbar-wrapper {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1000;
    }

    /* Sliding Menu Drawer */
    .menu-drawer {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      width: 320px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease;
      box-shadow: 0 -5px 25px rgba(0, 243, 255, 0.2);
      backdrop-filter: blur(10px);
    }

    .menu-drawer.open {
      max-height: 250px;
      padding: 15px 0;
    }

    .menu-options {
      list-style: none;
    }

    .menu-options li a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 25px;
      color: #e0f7fc;
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .menu-options li a:hover {
      background: rgba(0, 243, 255, 0.15);
      color: var(--primary);
      padding-left: 30px;
      text-shadow: 0 0 5px var(--primary);
    }

    /* Taskbar Trigger Button */
    .taskbar-trigger {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: 15px 15px 0 0;
      padding: 10px 40px;
      cursor: pointer;
      color: var(--primary);
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: 0 -2px 15px rgba(0, 243, 255, 0.3);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .taskbar-trigger:hover {
      background: rgba(0, 243, 255, 0.1);
      box-shadow: 0 -2px 20px rgba(0, 243, 255, 0.6);
    }

    .icon-arrow {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .menu-drawer.open + .taskbar-trigger .icon-arrow {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="brand">
      <span>&#x2B21;</span> JARVIS
    </div>
    <div class="clock-container">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date">CARGANDO...</div>
    </div>
  </header>

  <div class="taskbar-wrapper">
    <div id="menuDrawer" class="menu-drawer">
      <ul class="menu-options">
        <li><a href="#diagnostics"><span>&#x2699;</span> Diagnóstico del Sistema</a></li>
        <li><a href="#protocol"><span>&#x1F6E1;</span> Protocolos de Seguridad</a></li>
        <li><a href="#network"><span>&#x1F4E1;</span> Red y Comandancia</a></li>
        <li><a href="#power"><span>&#x26A1;</span> Gestión de Energía</a></li>
      </ul>
    </div>
    <button id="taskbarTrigger" class="taskbar-trigger">
      MENÚ <span class="icon-arrow">&#x25B2;</span>
    </button>
  </div>

  <script>
    // Digital Clock Logic
    function updateClock() {
      const now = new Date();
      
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('es-ES', options).toUpperCase();
    }
    
    setInterval(updateClock, 1000);
    updateClock();

    // Menu Drawer Toggle Logic
    const trigger = document.getElementById('taskbarTrigger');
    const drawer = document.getElementById('menuDrawer');

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      drawer.classList.toggle('open');
    });

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      if (!drawer.contains(e.target) && !trigger.contains(e.target)) {
        drawer.classList.remove('open');
      }
    });
  </script>
</body>
</html>
